name: release plugin

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          9.0.x

    - name: Get plugin version from plugin.json
      id: version
      uses: notiz-dev/github-action-json-property@release
      with:
        path: 'plugin.json'
        prop_path: 'Version'

    - name: Publish GrepFlow
      run: dotnet publish GrepFlow.csproj -c Release -o ./publish

    - name: Create release zip
      shell: pwsh
      run: |
        $zipPath = "Flow.Launcher.Plugin.GrepFlow.zip"
        if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
        Compress-Archive -Path ./publish/* -DestinationPath $zipPath

    - name: Publish Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        files: 'Flow.Launcher.Plugin.GrepFlow.zip'
        tag_name: "v${{ steps.version.outputs.prop }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
